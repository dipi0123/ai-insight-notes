<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">class 세 개 위의 세 distribution과 entropy</title>
  <desc id="d">세 칸에 class 세 개의 확률 막대를 그렸다. 왼쪽은 1/3씩 고르게 퍼진 distribution으로 entropy가 1.099 nat이다. 가운데는 0.7, 0.2, 0.1로 치우친 distribution으로 entropy가 0.802 nat이다. 오른쪽은 1, 0, 0으로 한 class에 몰린 distribution으로 entropy가 0이다.</desc>
  <rect width="600" height="360" fill="#ffffff"/>
  <text x="105" y="36" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">고르게 퍼짐</text>
  <line x1="20" y1="250" x2="190" y2="250" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="30" y="193.3" width="44" height="56.7" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="52" y="185.3" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.33</text>
  <rect x="84" y="193.3" width="44" height="56.7" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="106" y="185.3" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.33</text>
  <rect x="138" y="193.3" width="44" height="56.7" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="160" y="185.3" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.33</text>
  <text x="105" y="284" font-size="20" fill="#b45309" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">H = 1.099</text>
  <text x="300" y="36" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">한쪽으로 치우침</text>
  <line x1="215" y1="250" x2="385" y2="250" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="225" y="131.0" width="44" height="119.0" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="247" y="123.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.70</text>
  <rect x="279" y="216.0" width="44" height="34.0" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="301" y="208.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.20</text>
  <rect x="333" y="233.0" width="44" height="17.0" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="355" y="225.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.10</text>
  <text x="300" y="284" font-size="20" fill="#b45309" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">H = 0.802</text>
  <text x="495" y="36" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">한 class에 몰림</text>
  <line x1="410" y1="250" x2="580" y2="250" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="420" y="80.0" width="44" height="170.0" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="442" y="72.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">1</text>
  <text x="496" y="242.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0</text>
  <text x="550" y="242.0" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0</text>
  <text x="495" y="284" font-size="20" fill="#b45309" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">H = 0.000</text>
  <text x="300" y="338" font-size="18" fill="#374151" text-anchor="middle">단위는 nat. 가장 큰 값은 log 3 ≈ 1.099다</text>
</svg>
