<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">loss 곡선과 세 점의 tangent line</title>
  <desc id="d">가로축은 weight w, 세로축은 loss L(w) = (3w − 1)²이다. 곡선은 w = 1/3에서 가장 낮고 양쪽으로 올라간다. w = 0에서 그은 tangent line은 오른쪽 아래로 내려가며 기울기가 −6이다. w = 1에서 그은 tangent line은 오른쪽 위로 가파르게 올라가며 기울기가 12이다. 가장 낮은 점 w = 1/3의 tangent line은 수평이고 기울기가 0이다.</desc>
