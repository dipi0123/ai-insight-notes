<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">exp와 log의 곡선</title>
  <desc id="d">왼쪽 그림은 x가 −3에서 2까지일 때 e의 x제곱 곡선이다. 곡선은 모든 곳에서 0보다 위에 있고, x = 0에서 1을 지나며 오른쪽으로 갈수록 빠르게 커진다. 오른쪽 그림은 x가 0보다 크고 5까지일 때 log x 곡선이다. x = 1에서 0을 지나고, 0과 1 사이에서는 음수이며 x가 0에 가까워질수록 아래로 한없이 내려간다.</desc>
