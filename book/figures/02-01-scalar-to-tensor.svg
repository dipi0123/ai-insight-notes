  <title id="t">scalar에서 tensor까지: axis 수가 하나씩 늘어난다</title>
  <desc id="d">왼쪽부터 네 개의 숫자 배열이 놓여 있다. scalar는 칸 하나로 axis가 0개이고 shape는 빈 괄호다. vector는 칸 세 개를 한 줄로 늘어놓아 axis가 1개이고 shape는 (3,)이다. matrix는 2행 3열 배열로 axis가 2개이고 shape는 (2, 3)이다. tensor는 3행 4열 배열 두 개를 겹쳐 쌓은 모양으로 axis가 3개이고 shape는 (2, 3, 4)이다.</desc>
