  <text x="520.0" y="274" font-size="17" fill="#1f2937" text-anchor="middle">μ+σ</text>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">normal: 넓이가 확률</text>
  <text x="480" y="306" font-size="16" fill="#374151" text-anchor="middle">곡선 아래 전체 넓이 = 1</text>
</svg>
