<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">categorical distribution과 normal distribution</title>
  <desc id="d">왼쪽 그림은 class 세 개의 categorical distribution 막대그래프로 cat 0.7, dog 0.2, bird 0.1이고 막대 높이가 확률이며 합은 1이다. 오른쪽 그림은 평균 0, standard deviation 1인 standard normal distribution의 종 모양 곡선이다. 봉우리는 평균 μ에 있고, μ에서 σ만큼 떨어진 두 점이 표시되어 있다. 확률은 곡선 아래 넓이다.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <line x1="40" y1="250" x2="290" y2="250" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="60" y="83.8" width="56" height="166.2" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="88" y="75.8" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.7</text>
  <text x="88" y="274" font-size="17" fill="#1f2937" text-anchor="middle">cat</text>
  <rect x="140" y="202.5" width="56" height="47.5" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="168" y="194.5" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.2</text>
  <text x="168" y="274" font-size="17" fill="#1f2937" text-anchor="middle">dog</text>
  <rect x="220" y="226.2" width="56" height="23.8" fill="#93c5fd" stroke="#4b5563" stroke-width="1"/>
  <text x="248" y="218.2" font-size="17" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0.1</text>
  <text x="248" y="274" font-size="17" fill="#1f2937" text-anchor="middle">bird</text>
  <text x="165" y="30" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">categorical: 막대 높이가 확률</text>
  <text x="165" y="306" font-size="16" fill="#374151" text-anchor="middle">0.7 + 0.2 + 0.1 = 1</text>
