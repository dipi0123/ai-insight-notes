<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">등고선 위의 gradient와 그 반대 방향</title>
  <desc id="d">가로축 w1, 세로축 w2 평면에 L(w1, w2) = w1² + 3w2²의 값이 1, 4, 9인 곳을 이은 타원 세 개가 원점을 둘러싸고 있다. 점 (1, 1)은 L = 4인 타원 위에 있다. 그 점에서 빨간 화살표가 gradient (2, 6) 방향, 곧 바깥쪽 위로 가파르게 향하고, 파란 화살표가 그 반대 방향 (−2, −6), 곧 원점 쪽 아래로 향한다. 빨간 화살표는 loss가 가장 빨리 커지는 방향, 파란 화살표는 가장 빨리 줄어드는 방향이다.</desc>
  <rect width="600" height="430" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <line x1="27.0" y1="215" x2="573.0" y2="215" stroke="#9ca3af" stroke-width="1"/>
  <line x1="300" y1="397.0" x2="300" y2="33.0" stroke="#9ca3af" stroke-width="1"/>
  <text x="576.5" y="221" font-size="18" font-style="italic" fill="#1f2937">w₁</text>
  <text x="308" y="29.5" font-size="18" font-style="italic" fill="#1f2937">w₂</text>
  <ellipse cx="300" cy="215" rx="70.0" ry="40.4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
  <text x="225.0" y="209" font-size="16" fill="#4b5563" text-anchor="end">L = 1</text>
  <ellipse cx="300" cy="215" rx="140.0" ry="80.8" fill="none" stroke="#6b7280" stroke-width="1.6"/>
  <text x="155.0" y="209" font-size="16" fill="#4b5563" text-anchor="end">L = 4</text>
  <ellipse cx="300" cy="215" rx="210.0" ry="121.2" fill="none" stroke="#6b7280" stroke-width="1.6"/>
  <text x="85.0" y="209" font-size="16" fill="#4b5563" text-anchor="end">L = 9</text>
  <line x1="370.0" y1="145.0" x2="392.1" y2="78.6" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="370.0" y1="145.0" x2="347.9" y2="211.4" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <circle cx="370.0" cy="145.0" r="6" fill="#1f2937"/>
  <text x="382.0" y="151.0" font-size="17" fill="#1f2937">(1, 1)</text>
  <text x="402.1" y="86.6" font-size="17" fill="#dc2626">gradient (2, 6)</text>
  <text x="335" y="240" font-size="17" fill="#2563eb" text-anchor="end">−gradient</text>
  <text x="300" y="412" font-size="16" fill="#374151" text-anchor="middle">L(w₁, w₂) = w₁² + 3w₂²의 등고선</text>
</svg>
